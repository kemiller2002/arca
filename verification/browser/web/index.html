<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Arca browser verification</title>
  <link rel="icon" href="data:,">
</head>
<body>
  <main>
    <h1>Arca in browser WebAssembly, behind Limen</h1>
    <button type="button" data-event="run">Run</button>
    <dl>
      <dt>Status</dt><dd id="status" data-text="status"></dd>
      <dt>Requests</dt><dd id="requests" data-text="requests"></dd>
      <dt>Commit</dt><dd id="commit" data-text="commit"></dd>
      <dt>Written revision</dt><dd id="writtenRevision" data-text="writtenRevision"></dd>
      <dt>Read revision</dt><dd id="readRevision" data-text="readRevision"></dd>
      <dt>Revisions match</dt><dd id="revisionsMatch" data-text="revisionsMatch"></dd>
      <dt>Content matches</dt><dd id="contentMatches" data-text="contentMatches"></dd>
      <dt>Record decodes</dt><dd id="recordDecodes" data-text="recordDecodes"></dd>
      <dt>Error</dt><dd id="error" data-text="error"></dd>
    </dl>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
